name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: integrations/tapdeck-helper/go.mod
          cache: false
      - name: Test Tapdeck Helper
        working-directory: integrations/tapdeck-helper
        run: go test ./...
      - name: Build MiSTer helper
        working-directory: integrations/tapdeck-helper
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 0
        run: go build -buildvcs=false -o /tmp/tapdeck-helper .
