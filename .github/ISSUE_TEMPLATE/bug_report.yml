name: Bug report
description: Report behaviour that does not work as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove MiSTer IP addresses, credentials, and personal network details before submitting.
  - type: input
    id: version
    attributes:
      label: Tapdeck version
      description: For example, 1.0.4.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android device and version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open ...\n2. Tap ...\n3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Screenshots or relevant logs
      description: Remove credentials, IP addresses, and personal paths.